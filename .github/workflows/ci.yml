name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm install --ignore-scripts
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run pages:build
        env:
          PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_test
      - run: npm run pages:budget
