name: Bootstrap MVP source

on:
  push:
    paths:
      - 'bootstrap/part-07'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct project source
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/part-* > /tmp/project.b64
          base64 --decode /tmp/project.b64 | gzip -d | tar -xf -
          rm -rf bootstrap
          rm -f .github/workflows/bootstrap.yml

      - name: Commit imported MVP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'feat: import Research Frontier Radar MVP'
          git push
